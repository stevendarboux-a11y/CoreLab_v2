name: Keep MongoDB Atlas alive

# Appelle l'API toutes les ~2 semaines pour que le cluster Atlas gratuit (M0)
# ne soit pas mis en pause pour inactivité.
on:
  schedule:
    - cron: '0 8 1,15 * *' # le 1er et le 15 de chaque mois à 8h UTC
  workflow_dispatch: # permet aussi de le lancer à la main depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API + MongoDB
        # Render (plan gratuit) peut mettre ~1 min à se réveiller : timeout large + retries
        run: |
          curl --fail --silent --show-error \
            --max-time 120 --retry 3 --retry-delay 30 --retry-all-errors \
            https://corelab-api-plyb.onrender.com/api/ping
